<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">H-Bot · RDK S600 策略部署</title>
  <desc id="desc">单帧离线推理示意。固定观测通过 S600 上的 LeRobot π0.5 推理，输出 50 步、每步 8 维的动作块。动画展示处理顺序。</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#eef7ff"/><stop offset=".56" stop-color="#effcf7"/><stop offset="1" stop-color="#fff2da"/></linearGradient>
    <linearGradient id="chip" x2="1" y2="1"><stop stop-color="#00b99c"/><stop offset="1" stop-color="#0877ad"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#35758c" opacity=".13"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#215478" flood-opacity=".12"/></filter>
    <clipPath id="frame"><rect x="88" y="245" width="223" height="136" rx="15"/></clipPath>
    <clipPath id="matrix"><rect x="895" y="246" width="216" height="132" rx="13"/></clipPath>
    <pattern id="cells" x="895" y="246" width="24" height="16.5" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="20" height="12.5" rx="3" fill="#ffd588"/></pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #11344f; }
    .heading { font-weight: 750; font-size: 38px; }
    .caption { font-size: 27px; font-weight: 600; fill: #426781; }
    .packet { animation: travel 4s linear infinite; }
    .scan { animation: observe 4s ease-in-out infinite; }
    .ring { transform-origin: 600px 314px; animation: spin 6s linear infinite; }
    .sweep { animation: sequence 4s ease-in-out infinite; }
    @keyframes travel { 0%,10% { transform:translateX(0); opacity:0; } 18% { opacity:1; } 42% { transform:translateX(69px); opacity:1; } 49%,100% { transform:translateX(69px); opacity:0; } }
    @keyframes observe { 0%,100% { transform:translateY(0); } 36%,76% { transform:translateY(99px); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes sequence { 0%,35% { transform:translateX(0); opacity:.25; } 48% { opacity:1; } 86%,100% { transform:translateX(192px); opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .packet,.scan,.ring,.sweep { animation:none; } }
  </style>
  <rect x="1" y="1" width="1198" height="598" rx="31" fill="url(#paper)" stroke="#d9ecee" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="596" rx="30" fill="url(#dots)"/>
  <path d="M928 2H1168Q1198 2 1198 32V115Q1055 144 928 2Z" fill="#ffe7ae" opacity=".68"/>
  <path d="M2 520Q154 480 304 598H32Q2 598 2 568Z" fill="#bbeee3" opacity=".62"/>
  <rect x="40" y="45" width="8" height="60" rx="4" fill="#ff9e37"/>
  <text x="65" y="92" font-size="58" font-weight="750">H-Bot <tspan fill="#087c87">· RDK S600</tspan></text>
  <rect x="855" y="47" width="300" height="60" rx="30" fill="#fff" stroke="#f1ddae" stroke-width="2"/>
  <circle cx="889" cy="77" r="7" fill="#f4a235"/>
  <text x="912" y="88" font-size="31" font-weight="700">单帧离线验证</text>
  <g fill="#fff" stroke="#e2eaee" stroke-width="2" filter="url(#shadow)">
    <rect x="38" y="146" width="322" height="398" rx="25"/>
    <rect x="431" y="146" width="338" height="398" rx="25"/>
    <rect x="840" y="146" width="322" height="398" rx="25"/>
  </g>
  <g stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M368 316H419m-10-10 10 10-10 10" stroke="#60a8e9"/>
    <path d="M778 316H829m-10-10 10 10-10 10" stroke="#52bda6"/>
  </g>
  <circle class="packet" cx="360" cy="316" r="8" fill="#1879df" stroke="white" stroke-width="3"/>
  <circle class="packet" cx="770" cy="316" r="8" fill="#009f82" stroke="white" stroke-width="3" style="animation-delay:1.25s"/>
  <text x="199" y="212" text-anchor="middle" class="heading">固定观测</text>
  <g clip-path="url(#frame)">
    <rect x="88" y="245" width="223" height="136" fill="#e2f0ff"/>
    <path d="M88 352H311V381H88Z" fill="#a9cff5"/>
    <rect x="124" y="322" width="59" height="30" rx="5" fill="#70a9e7"/>
    <rect x="229" y="306" width="36" height="45" rx="5" fill="#ffbf57"/>
    <path d="M142 271H186L207 291v16m-12-2v12m23-12v12m-23-13h23" fill="none" stroke="#377cc6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="scan" x="88" y="260" width="223" height="19" fill="#329bff" opacity=".25"/>
    <path d="M102 275v-15h16m163 0h16v15m0 77v15h-16m-163 0h-16v-15" fill="none" stroke="#4f98e1" stroke-width="3"/>
  </g>
  <text x="199" y="490" text-anchor="middle" class="caption">单帧输入</text>
  <text x="600" y="212" text-anchor="middle" class="heading">板端推理</text>
  <circle cx="600" cy="314" r="91" fill="#e6faf5"/>
  <circle class="ring" cx="600" cy="314" r="90" fill="none" stroke="#0fbba4" stroke-width="5" stroke-dasharray="53 24 13 51"/>
  <path d="M527 286h19m-19 28h19m-19 28h19m108-56h19m-19 28h19m-19 28h19m-101-99v19m28-19v19m28-19v19m-56 104v19m28-19v19m28-19v19" stroke="#2cbba9" stroke-width="5" stroke-linecap="round"/>
  <rect x="546" y="260" width="108" height="108" rx="19" fill="url(#chip)"/>
  <rect x="553" y="267" width="94" height="94" rx="15" fill="none" stroke="#8de8db" opacity=".78" stroke-width="2"/>
  <text x="600" y="328" text-anchor="middle" font-size="42" font-weight="750" style="fill:#fff">π0.5</text>
  <text x="600" y="490" text-anchor="middle" class="caption">LeRobot π0.5</text>
  <text x="1001" y="212" text-anchor="middle" class="heading">动作序列</text>
  <g clip-path="url(#matrix)">
    <rect x="895" y="246" width="216" height="132" fill="#fff5e4"/>
    <rect x="895" y="246" width="216" height="132" fill="url(#cells)"/>
    <rect class="sweep" x="895" y="246" width="24" height="132" rx="5" fill="#e99124" style="mix-blend-mode:multiply"/>
  </g>
  <text x="1001" y="490" text-anchor="middle" font-size="36" font-weight="750" style="fill:#925010">50 步 × 8 维</text>
</svg>
