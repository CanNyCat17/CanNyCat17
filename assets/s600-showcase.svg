<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Roboto Origin · S600 多模态感知</title>
  <desc id="desc">部署示意。相机和麦克风送入 RDK S600，YOLO 处理实例分割，Qwen3-VL 回答图片问题，Whisper 转写语音。实测约 19.2 FPS 对应 120 秒相机分割。</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#ebf4ff"/><stop offset=".56" stop-color="#effcf8"/><stop offset="1" stop-color="#fff1dc"/></linearGradient>
    <linearGradient id="screen" x2=".8" y2="1"><stop stop-color="#d8edff"/><stop offset="1" stop-color="#ccefe7"/></linearGradient>
    <linearGradient id="chip" x2=".8" y2="1"><stop stop-color="#32d0b8"/><stop offset="1" stop-color="#097a9f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#215478" flood-opacity=".13"/></filter>
    <linearGradient id="glass" x2=".22" y2="1">
      <stop stop-color="#fff" stop-opacity=".96"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".69"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".39"/>
    </linearGradient>
    <linearGradient id="rim" x2=".85" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".56"/>
      <stop offset="1" stop-color="#77a9c9" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="ribbon" x2="1" y2="0">
      <stop stop-color="#81a7ff"/>
      <stop offset=".53" stop-color="#74e0ca"/>
      <stop offset="1" stop-color="#ffc684"/>
    </linearGradient>
    <filter id="bloom"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="canvas"><rect x="2" y="2" width="1196" height="596" rx="30"/></clipPath>
    <clipPath id="display"><rect x="853" y="245" width="268" height="153" rx="19"/></clipPath>
  </defs>
  <style>
    text { font-family:'Segoe UI','Microsoft YaHei',sans-serif; fill:#123650; }
    .heading { font-size:36px; font-weight:750; }
    .label { font-size:26px; font-weight:650; }
    .small { font-size:23px; font-weight:600; }
    .flow { stroke-dasharray:16 58; animation:move 1.6s linear infinite; }
    .scan { animation:scan 3.6s ease-in-out infinite; }
    .model { animation:focus 5.4s ease-in-out infinite; }
    .model:nth-of-type(2) { animation-delay:1.8s; }
    .model:nth-of-type(3) { animation-delay:3.6s; }
    @keyframes move { to { stroke-dashoffset:-74; } }
    @keyframes scan { 0%,100% { transform:translateY(0); } 50% { transform:translateY(122px); } }
    @keyframes focus { 0%,31%,100% { opacity:.35; } 11%,20% { opacity:1; } }
    @media (prefers-reduced-motion:reduce) { .flow,.scan,.model { animation:none; } .model { opacity:.65; } }
  </style>
  <rect x="1" y="1" width="1198" height="598" rx="31" fill="url(#paper)" stroke="#d9ecee" stroke-width="2"/>
  <g clip-path="url(#canvas)" fill="none">
    <path d="M-107 441C87 544 243 438 440 282S789 58 978 232s198 145 315 22" stroke="url(#ribbon)" stroke-width="168" opacity=".46" filter="url(#bloom)"/>
    <path d="M-93 545C124 602 255 487 426 374S751 183 916 303s214 125 342 38" stroke="url(#ribbon)" stroke-width="54" opacity=".53"/>
    <path d="M-93 524C124 581 255 466 426 353S751 162 916 282s214 125 342 38" stroke="#fff" stroke-width="3" opacity=".8"/>
    <path d="M-54 401C128 472 260 347 425 247S714 79 875 180s207 153 399 61" stroke="#fff" stroke-width="1.5" opacity=".68"/>
  </g>
  <rect x="40" y="45" width="8" height="60" rx="4" fill="#ff9e37"/>
  <text x="65" y="92" font-size="55" font-weight="750">Roboto Origin <tspan fill="#087c87">· S600</tspan></text>
  <rect x="888" y="47" width="267" height="60" rx="30" fill="url(#glass)" stroke="url(#rim)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="923" cy="77" r="7" fill="#0eaa91"/>
  <text x="947" y="88" font-size="30" font-weight="700">多模态感知</text>
  <g fill="url(#glass)" stroke="url(#rim)" stroke-width="3" filter="url(#shadow)">
    <rect x="38" y="160" width="265" height="368" rx="31"/>
    <rect x="368" y="139" width="386" height="410" rx="34"/>
    <rect x="815" y="160" width="347" height="368" rx="31"/>
  </g>
  <path d="M68 171h205m127-21h322m124 21h285" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/>
  <path d="M311 324h48m403 0h44" stroke="#a9d4e4" stroke-width="8" stroke-linecap="round"/>
  <path d="M311 324h48m403 0h44" class="flow" stroke="#159fae" stroke-width="6" stroke-linecap="round"/>
  <path d="m351 317 8 7-8 7m447-14 8 7-8 7" fill="none" stroke="#168b9c" stroke-width="3" stroke-linejoin="round"/>
  <text x="170" y="221" text-anchor="middle" class="heading">传感输入</text>
  <rect x="68" y="270" width="133" height="95" rx="24" fill="#78b8f5" filter="url(#shadow)"/>
  <rect x="74" y="276" width="121" height="75" rx="19" fill="#def3ff" stroke="white" stroke-width="3"/>
  <circle cx="115" cy="313" r="22" fill="#3f96e2"/><circle cx="115" cy="313" r="12" fill="#17578f"/><circle cx="111" cy="308" r="5" fill="#a5efff"/>
  <circle cx="165" cy="313" r="12" fill="#69b7ef"/><circle cx="165" cy="313" r="5" fill="white"/>
  <path d="M134 365v13m-21 0h42" fill="none" stroke="#5095d2" stroke-width="7" stroke-linecap="round"/>
  <rect x="229" y="273" width="30" height="62" rx="15" fill="#ffc369"/>
  <path d="M219 314v11a25 25 0 0 0 50 0v-11m-25 36v25m-15 0h30" fill="none" stroke="#cc811e" stroke-width="5" stroke-linecap="round"/>
  <text x="170" y="458" text-anchor="middle" class="label">相机 · 麦克风</text>
  <text x="561" y="210" text-anchor="middle" class="heading">RDK S600</text>
  <rect x="529" y="231" width="64" height="62" rx="14" fill="url(#chip)" stroke="#e3fff9" stroke-width="3" filter="url(#shadow)"/>
  <path d="M539 231v-8m22 8v-8m22 8v-8m-44 70v8m22-8v8m22-8v8m-54-58h-8m8 20h-8m8 20h-8m72-40h8m-8 20h8m-8 20h8" stroke="#30b8ac" stroke-width="3" stroke-linecap="round"/>
  <text x="561" y="271" text-anchor="middle" font-size="24" font-weight="800" style="fill:#fff">BPU</text>
  <g>
    <g class="model"><rect x="393" y="328" width="337" height="47" rx="14" fill="#c8e4ff" stroke="#6cadf4" stroke-width="2"/></g>
    <g class="model"><rect x="393" y="386" width="337" height="47" rx="14" fill="#c8f2e6" stroke="#51c2a9" stroke-width="2"/></g>
    <g class="model"><rect x="393" y="444" width="337" height="47" rx="14" fill="#ffe6ba" stroke="#f1b75d" stroke-width="2"/></g>
    <text x="414" y="360" class="label">YOLO</text><text x="710" y="360" text-anchor="end" class="small">实例分割</text>
    <text x="414" y="418" class="label">Qwen3-VL</text><text x="710" y="418" text-anchor="end" class="small">图片问答</text>
    <text x="414" y="476" class="label">Whisper</text><text x="710" y="476" text-anchor="end" class="small">语音转写</text>
  </g>
  <text x="989" y="221" text-anchor="middle" class="heading">Web 展示</text>
  <rect x="847" y="239" width="280" height="165" rx="24" fill="white" filter="url(#shadow)"/>
  <g clip-path="url(#display)">
    <rect x="853" y="245" width="268" height="153" fill="url(#screen)"/>
    <path d="M853 384l56-52 40 30 37-48 63 70z" fill="#8fccc7"/>
    <circle cx="890" cy="295" r="15" fill="#ffcb61"/>
    <rect x="929" y="304" width="67" height="69" rx="9" fill="#28b59f" fill-opacity=".32" stroke="#15a18d" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="1021" y="279" width="85" height="83" rx="13" fill="#fff" fill-opacity=".77"/>
    <path d="M1037 301h50m-50 16h43m-43 16h33" stroke="#519f98" stroke-width="4" stroke-linecap="round"/>
    <path class="scan" d="M853 259h268" stroke="#5cd9c9" stroke-width="5" opacity=".78"/>
  </g>
  <text x="989" y="457" text-anchor="middle" class="label">相机分割约 19.2 FPS</text>
  <text x="989" y="490" text-anchor="middle" class="small">实测 120 秒</text>
</svg>
