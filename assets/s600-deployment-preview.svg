<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">S600 多模态部署</title><desc id="desc">部署流程示意，并非实机界面截图。相机与麦克风输入，S600 BPU运行分割、图片问答和转写，Web展示结果。深度与雷达独立展示。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf8ff"/><stop offset=".5" stop-color="#f1fff9"/><stop offset="1" stop-color="#fff3dd"/></linearGradient>
<linearGradient id="chip" x2="1" y2="1"><stop stop-color="#09bd9e"/><stop offset="1" stop-color="#078dce"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a6cdd3" opacity=".35"/></pattern>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#387c90" flood-opacity=".12"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#0ea99d" stroke-width="2"/></marker>
</defs>
<style>
/* Gentle illustrative motion; all labels and layout remain stationary. */
@keyframes flow {0%,10%{opacity:0;transform:translateX(0)}20%{opacity:1}65%{opacity:1}80%,100%{opacity:0;transform:translateX(22px)}}
@keyframes breathe {0%,100%{opacity:.12}50%{opacity:.65}}
@keyframes wave {0%,100%{transform:scaleY(.45);opacity:.55}50%{transform:scaleY(1);opacity:1}}
@keyframes segment {0%,15%,100%{opacity:.18}40%,70%{opacity:.65}}
.flow{animation:flow 1.6s linear infinite;stroke:white;stroke-width:2;r:7px}
.flow.second{animation-delay:.8s}
.breath{animation:breathe 2s ease-in-out infinite;stroke-width:5}
.wave{transform-box:fill-box;transform-origin:center;animation:wave .8s ease-in-out infinite;stroke-width:6}
.wave.b{animation-delay:-.7s}.wave.c{animation-delay:-1.4s}
.segment{animation:segment 2.4s ease-in-out infinite;stroke-width:4}
@keyframes scan{0%{transform:translateY(0);opacity:0}12%,85%{opacity:.9}100%{transform:translateY(92px);opacity:0}}
@keyframes model{0%,30%{opacity:1}36%,94%{opacity:.08}100%{opacity:1}}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.scan{animation:scan 2.4s linear infinite}
.model{animation:model 4.8s ease-in-out infinite}
.model.two{animation-delay:-3.2s}.model.three{animation-delay:-1.6s}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
path[d^="M1044 342v-8m10"]{opacity:.15}
@media (prefers-reduced-motion:reduce){.flow,.breath,.wave,.segment,.scan,.model,.ring{animation:none}.flow,.scan,.ring{opacity:0}.breath,.model{opacity:.2}.segment{opacity:.35}}
</style>
