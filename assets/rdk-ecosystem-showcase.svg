<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">RDK 开发者生态</title>
  <desc id="desc">左侧播放器展示 X5/S100 双语课程已交付。右侧日志高亮与对话气泡展示论坛技术答复在持续开展。</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#edf7ff"/><stop offset=".56" stop-color="#effcf7"/><stop offset="1" stop-color="#fff1dc"/></linearGradient>
    <linearGradient id="board" x2="1" y2="1"><stop stop-color="#48a9f9"/><stop offset="1" stop-color="#2368c8"/></linearGradient>
    <linearGradient id="bubble" x2="1" y2="1"><stop stop-color="#c7f5e8"/><stop offset="1" stop-color="#9de2df"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#35758c" opacity=".13"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#215478" flood-opacity=".11"/></filter>
    <linearGradient id="glass" x2=".22" y2="1">
      <stop stop-color="#fff" stop-opacity=".96"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".69"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".39"/>
    </linearGradient>
    <linearGradient id="rim" x2=".85" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".56"/>
      <stop offset="1" stop-color="#77a9c9" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="ribbon" x2="1" y2="0">
      <stop stop-color="#81a7ff"/>
      <stop offset=".53" stop-color="#74e0ca"/>
      <stop offset="1" stop-color="#ffc684"/>
    </linearGradient>
    <filter id="bloom"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="canvas"><rect x="2" y="2" width="1196" height="596" rx="30"/></clipPath>
  </defs>
  <style>
    text { font-family:'Segoe UI','Microsoft YaHei',sans-serif; fill:#123650; }
    .heading { font-size:42px; font-weight:750; }
    .caption { font-size:32px; font-weight:650; }
    .playback { transform-origin:128px 408px; animation:play 4.8s ease-in-out infinite; }
    .log { animation:scan 4.8s ease-in-out infinite; }
    .reply { animation:respond 4.8s ease-in-out infinite; }
    @keyframes play { 0% { transform:scaleX(.12); } 78%,100% { transform:scaleX(1); } }
    @keyframes scan { 0%,14% { transform:translateY(0); } 31%,43% { transform:translateY(27px); } 59%,90% { transform:translateY(54px); } 100% { transform:translateY(0); } }
    @keyframes respond { 0%,48% { opacity:.55; transform:translateY(5px); } 68%,100% { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion:reduce) { .playback,.log,.reply { animation:none; } .playback { transform:scaleX(.72); } }
  </style>
  <rect x="1" y="1" width="1198" height="598" rx="31" fill="url(#paper)" stroke="#d9ecee" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="596" rx="30" fill="url(#dots)"/>
  <g clip-path="url(#canvas)" fill="none">
    <path d="M-107 441C87 544 243 438 440 282S789 58 978 232s198 145 315 22" stroke="url(#ribbon)" stroke-width="168" opacity=".46" filter="url(#bloom)"/>
    <path d="M-93 545C124 602 255 487 426 374S751 183 916 303s214 125 342 38" stroke="url(#ribbon)" stroke-width="54" opacity=".53"/>
    <path d="M-93 524C124 581 255 466 426 353S751 162 916 282s214 125 342 38" stroke="#fff" stroke-width="3" opacity=".8"/>
    <path d="M-54 401C128 472 260 347 425 247S714 79 875 180s207 153 399 61" stroke="#fff" stroke-width="1.5" opacity=".68"/>
  </g>
  <rect x="40" y="45" width="8" height="60" rx="4" fill="#ff9e37"/>
  <text x="65" y="92" font-size="58" font-weight="750">RDK <tspan fill="#087c87">开发者生态</tspan></text>
  <g fill="url(#glass)" stroke="url(#rim)" stroke-width="3" filter="url(#shadow)">
    <rect x="38" y="139" width="544" height="407" rx="33"/>
    <rect x="618" y="139" width="544" height="407" rx="33"/>
  </g>
  <path d="M73 150h474m106 0h474" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/>
  <text x="75" y="208" class="heading">课程交付</text>
  <rect x="397" y="167" width="150" height="51" rx="25" fill="#e1efff"/>
  <text x="472" y="202" text-anchor="middle" class="caption" style="fill:#175a9b">已完成</text>
  <rect x="102" y="241" width="414" height="196" rx="22" fill="url(#glass)" stroke="#fff" stroke-width="4" filter="url(#shadow)"/>
  <rect x="124" y="263" width="370" height="127" rx="13" fill="#d7eaff"/>
  <g transform="translate(149 275)">
    <rect width="132" height="99" rx="14" fill="url(#board)"/>
    <g fill="#c9e9ff"><circle cx="12" cy="12" r="4"/><circle cx="120" cy="12" r="4"/><circle cx="12" cy="87" r="4"/><circle cx="120" cy="87" r="4"/></g>
    <path d="M21 31h15v36H21m76-36h15v36H97" fill="#9bd1fb"/>
    <rect x="45" y="27" width="42" height="45" rx="6" fill="#eaf6ff"/>
    <path d="M51 20v7m10-7v7m10-7v7m10-7v7M51 72v7m10-7v7m10-7v7m10-7v7" stroke="#c2e6ff" stroke-width="3"/>
  </g>
  <circle cx="398" cy="326" r="42" fill="url(#glass)" stroke="#fff" stroke-width="4" filter="url(#shadow)"/>
  <path d="M388 308l29 18-29 18z" fill="#2678d4" stroke="#2678d4" stroke-width="4" stroke-linejoin="round"/>
  <rect x="128" y="403" width="362" height="10" rx="5" fill="#c7dff8"/>
  <rect class="playback" x="128" y="403" width="362" height="10" rx="5" fill="#378be6"/>
  <text x="310" y="502" text-anchor="middle" class="caption">X5/S100 双语课程</text>
  <text x="655" y="208" class="heading">社区支持</text>
  <rect x="953" y="167" width="174" height="51" rx="25" fill="#e0f7ef"/>
  <text x="1040" y="202" text-anchor="middle" class="caption" style="fill:#08725f">持续开展</text>
  <rect x="684" y="241" width="311" height="176" rx="20" fill="url(#glass)" stroke="#fff" stroke-width="4" filter="url(#shadow)"/>
  <path d="M685 282h309" stroke="#b5e0d8" stroke-width="2"/>
  <circle cx="708" cy="263" r="5" fill="#f6a74e"/><circle cx="727" cy="263" r="5" fill="#ffcc66"/><circle cx="746" cy="263" r="5" fill="#33bba2"/>
  <rect class="log" x="704" y="296" width="261" height="23" rx="7" fill="#9fe9d8"/>
  <path d="M722 308h153m-153 27h118m-118 27h165" fill="none" stroke="#4c988b" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <g class="reply">
    <path d="M962 316h113a19 19 0 0 1 19 19v65a19 19 0 0 1-19 19h-73l-28 19v-19h-12a19 19 0 0 1-19-19v-65a19 19 0 0 1 19-19z" fill="url(#bubble)" fill-opacity=".9" stroke="#effffa" stroke-width="4" filter="url(#shadow)"/>
    <path d="M974 353h90m-90 25h65" stroke="#217c72" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="890" y="502" text-anchor="middle" class="caption">日志分析 · 公开答复</text>
</svg>
